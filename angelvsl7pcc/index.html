  function decodeContent() {
    try {
      var binary = atob(ENCODED);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    } catch (e) { return ''; }
  }

  function reExecuteScripts(container) {
    container.querySelectorAll('script').forEach(function(oldScript) {
      var newScript = document.createElement('script');
      Array.from(oldScript.attributes).forEach(function(a) { newScript.setAttribute(a.name, a.value); });
      newScript.text = oldScript.textContent;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
  }

  function unlockPresell() {
    var holder = document.getElementById('presellContent');
    holder.innerHTML = decodeContent();
    holder.style.display = 'block';
    reExecuteScripts(holder);
    var overlay = document.getElementById('captchaOverlay');
    var dimmer  = document.getElementById('captchaDimmer');
    overlay.classList.add('hiding');
    dimmer.classList.add('hiding');
    setTimeout(function() {
      document.getElementById('presellPreview').remove();
      overlay.remove(); dimmer.remove();
      document.body.classList.remove('captcha-locked');
    }, 600);
  }

  document.getElementById('captchaVideo').addEventListener('click', unlockPresell);
  document.getElementById('captchaBtn').addEventListener('click', unlockPresell);
})();
