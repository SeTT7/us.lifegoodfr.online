<script>
  // AUDIO
  let audioCtx = null;
  function initAudio(){
    if(!audioCtx){try{audioCtx = new (window.AudioContext || window.webkitAudioContext)();}catch(e){}}
    if(audioCtx &amp;&amp; audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq, startOffset, duration, volume, type){
    if(!audioCtx) return;
    try{
      const now = audioCtx.currentTime + startOffset;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(volume, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + duration);
    }catch(e){}
  }
  function playSpinSound(){
    initAudio();
    for(let i = 0; i < 35; i++) tone(900 - i*18, i * 0.16, 0.05, 0.05, 'square');
  }
  function playWinSound(big){
    initAudio();
    tone(523.25, 0, 0.15, 0.18, 'sine');
    tone(659.25, 0.12, 0.15, 0.20, 'sine');
    tone(783.99, 0.24, 0.18, 0.22, 'sine');
    tone(1046.5, 0.36, 0.35, 0.25, 'sine');
    if(big){
      tone(1318.51, 0.55, 0.18, 0.22, 'sine');
      tone(1567.98, 0.68, 0.4, 0.25, 'sine');
    }
    if(navigator.vibrate) navigator.vibrate([60, 30, 60, 30, big ? 200 : 120]);
  }
  function playLoseSound(){
    initAudio();
    tone(440, 0, 0.2, 0.16, 'triangle');
    tone(370, 0.18, 0.22, 0.16, 'triangle');
    tone(311, 0.38, 0.35, 0.16, 'triangle');
    if(navigator.vibrate) navigator.vibrate(80);
  }

  // SEGMENTS
  const segments = [
    {label:'$25',       color:'#FE2C55', textColor:'#fff'},
    {label:'$900',      color:'#FFD60A', textColor:'#000'},
    {label:'$10',       color:'#25F4EE', textColor:'#000'},
    {label:'$5',        color:'#FE2C55', textColor:'#fff'},
    {label:'$47',       color:'#FFD60A', textColor:'#000'},
    {label:'TRY AGAIN', color:'#1a1a1f', textColor:'rgba(255,255,255,.6)'},
    {label:'$100',      color:'#25F4EE', textColor:'#000'},
    {label:'$50',       color:'#FE2C55', textColor:'#fff'}
  ];

  const SEG_TRY_AGAIN = 5;
  const SEG_47 = 4;
  const SEG_900 = 1;

  const numSegs = segments.length;
  const segAngle = 360 / numSegs;
  const cx = 100, cy = 100, r = 100;

  function polarToCart(angleDeg, radius){
    const a = (angleDeg - 90) * Math.PI / 180;
    return {x: cx + radius * Math.cos(a), y: cy + radius * Math.sin(a)};
  }
  function segmentPath(startA, endA){
    const start = polarToCart(endA, r);
    const end = polarToCart(startA, r);
    const largeArc = endA - startA <= 180 ? 0 : 1;
    return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 0 ${end.x} ${end.y} Z`;
  }
  function makeSegments(){
    const wheelSvg = document.getElementById('wheelSvg');
    let html = '';
    for(let i = 0; i < numSegs; i++){
      const startA = i * segAngle;
      const endA = (i+1) * segAngle;
      const seg = segments[i];
      html += `<path d=&quot;${segmentPath(startA, endA)}&quot; fill=&quot;${seg.color}&quot; stroke=&quot;rgba(0,0,0,.2)&quot; stroke-width=&quot;1&quot;/>`;
    }
    for(let i = 0; i < numSegs; i++){
      const startA = i * segAngle;
      const endA = (i+1) * segAngle;
      const midA = (startA + endA) / 2;
      const labelPos = polarToCart(midA, r * 0.62);
      const seg = segments[i];
      const isTryAgain = seg.label === 'TRY AGAIN';
      const fontSize = isTryAgain ? 8 : 16;
      const fontWeight = isTryAgain ? 800 : 900;
      html += `<text x=&quot;${labelPos.x}&quot; y=&quot;${labelPos.y}&quot;
        transform=&quot;rotate(${midA} ${labelPos.x} ${labelPos.y})&quot;
        text-anchor=&quot;middle&quot; dominant-baseline=&quot;middle&quot;
        fill=&quot;${seg.textColor}&quot;
        font-family=&quot;Inter Tight, sans-serif&quot;
        font-size=&quot;${fontSize}&quot; font-weight=&quot;${fontWeight}&quot;
        style=&quot;letter-spacing:-0.04em&quot;>${seg.label}</text>`;
    }
    wheelSvg.innerHTML = html;
  }
  makeSegments();

  function makeLights(){
    const lights = document.getElementById('wheelLights');
    const count = 28;
    let html = '';
    for(let i = 0; i < count; i++){
      const angle = (i / count) * 360;
      const a = (angle - 90) * Math.PI / 180;
      const rad = 48;
      const x = 50 + rad * Math.cos(a);
      const y = 50 + rad * Math.sin(a);
      html += `<div class=&quot;bulb&quot; style=&quot;left:${x}%;top:${y}%;animation-delay:${(i * 0.05).toFixed(2)}s&quot;></div>`;
    }
    lights.innerHTML = html;
  }
  makeLights();

  // STATE
  let spinCount = 0;
  const results = [SEG_TRY_AGAIN, SEG_47, SEG_900];
  const resultAmounts = [0, 47, 900];
  let totalWon = 0;
  let currentRotation = 0;

  const wheel = document.getElementById('wheel');
  const btnSpin = document.getElementById('btnSpin');
  const spinsLeftEl = document.getElementById('spinsLeft');
  const spinsDots = document.querySelectorAll('.spins-progress .dot');
  const balanceAmountEl = document.getElementById('balanceAmount');
  const historyCard = document.getElementById('historyCard');
  const historyList = document.getElementById('historyList');
  const modalBg = document.getElementById('modalBg');
  const modalContent = document.getElementById('modalContent');
  const confetti = document.getElementById('confetti');

  // SPIN LOGIC - CORRECTED
  function spin(){
    if(spinCount >= 3 || btnSpin.disabled) return;
    btnSpin.disabled = true;
    initAudio();

    const targetSegIdx = results[spinCount];
    // The pointer is at top (0deg, 12 o'clock).
    // The wheel rotates clockwise. A segment originally at angle X
    // ends up at position (X + rotation) mod 360 after rotation.
    // We want the segment's CENTER (segCenterAngle) to land at 0.
    // So we need: rotation mod 360 == (360 - segCenterAngle) mod 360
    const segCenterAngle = targetSegIdx * segAngle + segAngle / 2;
    const targetMod360 = (360 - segCenterAngle + 360) % 360;

    // Add jitter inside segment (±35% of half-segment)
    const halfSeg = segAngle / 2;
    const jitter = (Math.random() * 2 - 1) * halfSeg * 0.35;
    const targetModWithJitter = (targetMod360 + jitter + 360) % 360;

    // Current rotation mod 360
    const currentMod = ((currentRotation % 360) + 360) % 360;
    // Delta needed to reach target (always going forward = clockwise)
    let delta = (targetModWithJitter - currentMod + 360) % 360;
    // Add full turns for visual effect (always at least 6 full turns)
    const fullTurns = 6;
    delta += fullTurns * 360;

    currentRotation += delta;
    wheel.style.transform = `rotate(${currentRotation}deg)`;
    playSpinSound();

    setTimeout(() => handleResult(targetSegIdx), 5600);
  }

  function handleResult(segIdx){
    spinCount++;
    const won = resultAmounts[spinCount - 1];
    totalWon += won;
    spinsLeftEl.textContent = 3 - spinCount;

    const dot = spinsDots[spinCount - 1];
    dot.classList.remove('active');
    dot.classList.add('done');
    const pip = dot.querySelector('.pip');
    if(won > 0){
      pip.innerHTML = `<svg viewBox=&quot;0 0 24 24&quot;><polyline points=&quot;20 6 9 17 4 12&quot;/></svg>`;
    } else {
      dot.classList.add('lose');
      pip.innerHTML = `<svg viewBox=&quot;0 0 24 24&quot;><line x1=&quot;18&quot; y1=&quot;6&quot; x2=&quot;6&quot; y2=&quot;18&quot;/><line x1=&quot;6&quot; y1=&quot;6&quot; x2=&quot;18&quot; y2=&quot;18&quot;/></svg>`;
    }
    if(spinCount < 3) spinsDots[spinCount].classList.add('active');

    historyCard.classList.remove('empty');
    const hi = document.createElement('div');
    hi.className = 'history-item';
    if(won > 0){
      hi.innerHTML = `<div class=&quot;left&quot;><div class=&quot;badge win&quot;><svg viewBox=&quot;0 0 24 24&quot;><polyline points=&quot;20 6 9 17 4 12&quot;/></svg></div><div>Spin ${spinCount}</div></div><div class=&quot;val win&quot;>+$${won.toFixed(2)}</div>`;
    } else {
      hi.innerHTML = `<div class=&quot;left&quot;><div class=&quot;badge lose&quot;><svg viewBox=&quot;0 0 24 24&quot;><line x1=&quot;18&quot; y1=&quot;6&quot; x2=&quot;6&quot; y2=&quot;18&quot;/><line x1=&quot;6&quot; y1=&quot;6&quot; x2=&quot;18&quot; y2=&quot;18&quot;/></svg></div><div>Spin ${spinCount}</div></div><div class=&quot;val lose&quot;>No win</div>`;
    }
    historyList.appendChild(hi);
    animateBalance(balanceAmountEl, totalWon - won, totalWon);
    setTimeout(() => showResult(won), 700);
  }

  function animateBalance(el, from, to){
    const duration = 1100;
    const start = performance.now();
    function step(now){
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      const val = from + (to - from) * eased;
      el.textContent = '$' + val.toFixed(2);
      if(t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function showResult(won){
    const isWin = won > 0;
    const isBig = won >= 100;

    if(isWin){
      playWinSound(isBig);
      launchConfetti(isBig);
    } else {
      playLoseSound();
    }

    if(isWin){
      modalContent.innerHTML = `
        <div class=&quot;win-modal&quot;>
          <div class=&quot;win-card&quot;>
            <div class=&quot;win-stripe&quot;></div>
            <div class=&quot;win-brand&quot;>
              <div class=&quot;win-brand-logo&quot;>
                <svg viewBox=&quot;0 0 24 24&quot; fill=&quot;currentColor&quot;><path d=&quot;M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5.8 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.84-.1z&quot;/></svg>
              </div>
              TikTok <span class=&quot;reward-txt&quot;>· Rewards</span>
            </div>
            <div class=&quot;win-hero&quot;>
              <div class=&quot;win-pill&quot;>
                <span class=&quot;spark&quot;>✦</span>
                ${isBig ? 'Big Win' : 'You Won!'}
                <span class=&quot;spark&quot;>✦</span>
              </div>
              <div class=&quot;win-balance-label&quot;>Prize amount</div>
              <div class=&quot;win-amount&quot;><span class=&quot;cur&quot;>$</span><span>${won}</span></div>
              <div class=&quot;win-subline&quot;>
                <svg viewBox=&quot;0 0 24 24&quot;><polyline points=&quot;20 6 9 17 4 12&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;3&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/></svg>
                Added to your TikTok balance
              </div>
            </div>
            <div class=&quot;win-stats&quot;>
              <div class=&quot;win-stat&quot;>
                <div class=&quot;win-stat-label&quot;>Won this spin</div>
                <div class=&quot;win-stat-val pink&quot;>+$${won.toFixed(2)}</div>
              </div>
              <div class=&quot;win-stat&quot;>
                <div class=&quot;win-stat-label&quot;>Total balance</div>
                <div class=&quot;win-stat-val&quot;>$${totalWon.toFixed(2)}</div>
              </div>
              <div class=&quot;win-stat&quot;>
                <div class=&quot;win-stat-label&quot;>Spins left</div>
                <div class=&quot;win-stat-val&quot;>${3 - spinCount}</div>
              </div>
            </div>
            <div class=&quot;win-actions&quot;>
              <button class=&quot;win-btn&quot; id=&quot;continueBtn&quot;>

  .action-bar .arrow{
    color:#fff;font-size:13px;
    animation:bounce 1.4s ease-in-out infinite;
    position:relative;z-index:1;
  }
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

  /* VSL */
  .vsl-frame{
    position:relative;width:100%;aspect-ratio:9/11;
    background:#0a0a0a;border-radius:14px;
    overflow:hidden;cursor:pointer;
    background-image:
      radial-gradient(circle at 30% 30%,rgba(255,45,85,.28),transparent 55%),
      radial-gradient(circle at 70% 70%,rgba(245,184,0,.16),transparent 55%),
      linear-gradient(135deg,#1a1a1f,#0a0a0c);
    box-shadow:0 8px 24px -8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.04);
  }
  .vsl-placeholder{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:#fff;text-align:center;
  }
  .play-btn{
    width:62px;height:62px;
    background:linear-gradient(180deg,#ff4566,#ff2d55);
    border-radius:50%;display:grid;place-items:center;margin-bottom:12px;
    box-shadow:0 10px 28px -4px rgba(255,45,85,.6),inset 0 2px 0 rgba(255,255,255,.2);
    position:relative;
  }
  .play-btn::after{
    content:&quot;&quot;;position:absolute;inset:-7px;
    border:2px solid rgba(255,45,85,.55);border-radius:50%;
    animation:ringPulse 1.8s ease-out infinite;
  }
  @keyframes ringPulse{0%{transform:scale(1);opacity:1}100%{transform:scale(1.5);opacity:0}}
  .play-btn svg{margin-left:4px}
  .vsl-duration{
    background:rgba(255,255,255,.14);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.18);
    padding:5px 12px;border-radius:var(--radius-pill);
    font-size:10.5px;font-weight:600;
  }
  .vsl-sound{
    position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
    font-size:10px;color:#fff;background:rgba(0,0,0,.6);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    padding:4px 10px;border-radius:var(--radius-pill);font-weight:500;
  }

  /* ============ SCROLL CUE ============ */
  .scroll-cue-bold{
    margin-top:14px;
    background:linear-gradient(135deg,#fff8f9 0%,#ffe8ed 100%);
    border:1.5px solid rgba(255,45,85,.18);
    border-radius:14px;
    padding:10px 12px;
    display:flex;align-items:center;gap:10px;
    position:relative;overflow:hidden;
    box-shadow:0 4px 14px -6px rgba(255,45,85,.18);
    cursor:pointer;
    transition:transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .scroll-cue-bold:active{transform:scale(.98)}
  .scroll-cue-bold::before{
    content:&quot;&quot;;position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
    transform:translateX(-100%);
    animation:cueShine 3s ease-in-out infinite;
  }
  @keyframes cueShine{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
  .cue-avatars{display:flex;flex-shrink:0;position:relative;z-index:1}
  .cue-avatars .av{
    width:24px;height:24px;border-radius:50%;
    background-size:cover;background-position:center;
    border:2px solid #fff;margin-left:-7px;
    box-shadow:0 1px 3px rgba(0,0,0,.1);
  }
  .cue-avatars .av:first-child{margin-left:0}
  .cue-text{
    flex:1;font-size:12px;color:var(--ink);
    font-weight:500;line-height:1.25;
    position:relative;z-index:1;letter-spacing:-.005em;
  }
  .cue-text strong{color:var(--accent);font-weight:800}
  .cue-arrow-mini{
    width:26px;height:26px;border-radius:50%;
    background:var(--accent);color:#fff;
    display:grid;place-items:center;flex-shrink:0;
    position:relative;z-index:1;
    box-shadow:0 4px 10px -2px var(--accent-glow);
    animation:arrowBounce 1.4s ease-in-out infinite;
  }
  @keyframes arrowBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
  .cue-arrow-mini svg{
    width:13px;height:13px;stroke:currentColor;stroke-width:3;
    fill:none;stroke-linecap:round;stroke-linejoin:round;
  }

  /* ============ COMMENTS ============ */
  .comments-teaser{
    background:var(--card);border-radius:var(--radius-card);
    margin-top:10px;padding:14px 14px 8px;
    box-shadow:var(--shadow-card);position:relative;
    scroll-margin-top:70px;
  }
  .teaser-head{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:12px;padding-bottom:10px;
    border-bottom:1px solid var(--line-soft);
  }
  .teaser-head .title{
    display:flex;align-items:center;gap:7px;
    font-size:15px;font-weight:800;letter-spacing:-.02em;
  }
  .teaser-head .count-badge{
    background:linear-gradient(135deg,#fff0f3,#ffe1e7);
    color:var(--accent);
    padding:3px 8px;border-radius:var(--radius-pill);
    font-size:10px;font-weight:700;
  }
  .teaser-head .live-now{
    display:flex;align-items:center;gap:5px;
    font-size:10px;color:var(--accent);font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;
  }
  .teaser-head .live-now .dot{
    width:6px;height:6px;background:var(--accent);border-radius:50%;
    animation:pulseDot 1.2s ease-in-out infinite;
    box-shadow:0 0 6px var(--accent);
  }

  .comments-list{position:relative}
  .comment{
    display:flex;gap:11px;padding:11px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .comment:last-child{border-bottom:none}
  .c-avatar{
    width:36px;height:36px;border-radius:50%;
    background-size:cover;background-position:center;
    flex-shrink:0;background-color:#eee;
    box-shadow:0 1px 0 rgba(0,0,0,.04);
  }
  .c-body{flex:1;min-width:0}
  .c-head{
    display:flex;align-items:center;gap:5px;
    font-size:12px;color:var(--muted);font-weight:500;
    margin-bottom:3px;flex-wrap:wrap;
  }
  .c-username{color:var(--muted);font-weight:500;font-size:12px}
  .c-creator-tag{
    background:linear-gradient(135deg,#fff0f3,#ffe1e7);
    color:var(--accent);font-size:9px;font-weight:700;
    padding:1.5px 5px;border-radius:4px;
    letter-spacing:.04em;text-transform:uppercase;
  }
  .c-text{
    font-size:13px;line-height:1.45;color:var(--ink-soft);
    margin-bottom:6px;word-wrap:break-word;
  }
  /* comment with image */
  .c-image{
    margin:6px 0 8px;
    border-radius:10px;
    overflow:hidden;
    max-width:75%;
    background:#f3f3f5;
    aspect-ratio:1.3/1;
    background-size:cover;background-position:center;
    box-shadow:0 1px 0 rgba(0,0,0,.04);
    border:1px solid var(--line-soft);
  }
  .c-actions{
    display:flex;align-items:center;gap:14px;
    font-size:11px;color:var(--muted);font-weight:500;
  }
  .c-actions .reply{cursor:pointer}
  .c-actions .pinned{
    color:var(--accent);font-weight:700;
    display:inline-flex;align-items:center;gap:3px;
  }
  .c-like{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    flex-shrink:0;cursor:pointer;min-width:26px;user-select:none;
  }
  .c-like svg{
    width:19px;height:19px;
    color:#9a9a9e;
    fill:none !important;stroke:#9a9a9e !important;stroke-width:2;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1),color .2s,stroke .2s,fill .2s;
  }
  .c-like.liked svg{
    color:var(--accent) !important;
    fill:var(--accent) !important;
    stroke:var(--accent) !important;
    transform:scale(1.18);
  }
  .c-like .count{
    font-size:10px;color:var(--muted);font-weight:600;
    transition:color .2s;font-variant-numeric:tabular-nums;
  }
  .c-like.liked .count{color:var(--accent)}
  .c-like:active svg{transform:scale(.88)}
  .c-like.liked:active svg{transform:scale(1.08)}

  /* trust strip */
  .trust-strip{
    display:flex;justify-content:space-around;align-items:center;
    margin-top:6px;padding:12px 0 6px;
    border-top:1px solid var(--line-soft);
  }
  .trust-item{text-align:center}
  .trust-num{
    font-size:17px;font-weight:800;letter-spacing:-.03em;
    background:linear-gradient(180deg,#ff4566,#ff2d55);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .trust-label{
    font-size:9.5px;color:var(--muted);
    font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    margin-top:4px;
  }

  .foot{
    text-align:center;font-size:10px;color:var(--muted);
    margin-top:14px;padding:0 8px;line-height:1.5;
  }

  /* ============ TIKTOK-STYLE FOOTER ============ */
  .tt-footer{
    margin-top:16px;
    padding:18px 14px 14px;
    background:var(--card);
    border-radius:var(--radius-card);
    box-shadow:var(--shadow-card);
    text-align:center;
  }
  .tt-footer-logo{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:15px;
    font-weight:800;
    letter-spacing:-.02em;
    color:var(--ink);
    margin-bottom:8px;
  }
  .tt-footer-logo svg{width:20px;height:20px}
  .tt-footer-desc{
    font-size:11px;
    color:var(--muted);
    line-height:1.5;
    max-width:280px;
    margin:0 auto 14px;
  }
  .tt-footer-links{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:6px 14px;
    margin-bottom:14px;
    font-size:11px;
    color:var(--muted);
    font-weight:500;
  }
  .tt-footer-links a{
    color:var(--muted);
    text-decoration:none;
  }
  .tt-footer-links a:active{color:var(--ink)}
  .tt-footer-app{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:14px;
  }
  .tt-footer-app .store{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#000;
    color:#fff;
    padding:7px 12px;
    border-radius:8px;
    font-size:10px;
    font-weight:600;
    text-decoration:none;
    letter-spacing:.02em;
  }
  .tt-footer-app .store svg{width:16px;height:16px;color:#fff;fill:currentColor}
  .tt-footer-app .store .store-lbl{display:flex;flex-direction:column;line-height:1.1;align-items:flex-start}
  .tt-footer-app .store .store-lbl .small{font-size:7.5px;opacity:.7;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
  .tt-disclaimer{
    font-size:9.5px;
    color:var(--muted);
    line-height:1.55;
    padding-top:12px;
    border-top:1px solid var(--line-soft);
    max-width:300px;
    margin:0 auto;
  }
  .tt-disclaimer strong{color:#666;font-weight:700}

  /* sticky CTA */
  .sticky-cta{
    position:sticky;
    bottom:0;
    margin:14px -14px 0;
    z-index:50;
    display:flex;
    gap:8px;
    padding:12px 14px;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-top:1px solid rgba(0,0,0,.06);
    box-shadow:0 -8px 24px -8px rgba(0,0,0,.08);
  }
  .sticky-cta button{
    flex:1;
    background:linear-gradient(180deg,#d0d0d4,#bdbdc1);
    color:#fff;border:none;padding:15px;
    border-radius:var(--radius-pill);
    font-size:15px;font-weight:700;
    box-shadow:0 4px 0 #9a9a9e,0 8px 22px -8px rgba(0,0,0,.18);
    cursor:not-allowed;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:all .35s cubic-bezier(.34,1.56,.64,1);
    letter-spacing:-.015em;font-family:var(--font-body);
  }
  .sticky-cta button.unlocked{
    background:linear-gradient(180deg,#ff4566,#ff2d55);cursor:pointer;
    font-size:17px;
    font-weight:800;
    letter-spacing:.02em;
    box-shadow:0 5px 0 var(--accent-dark),0 14px 36px -8px rgba(255,45,85,.55),inset 0 1px 0 rgba(255,255,255,.22);
    animation:unlockPop .6s cubic-bezier(.34,1.56,.64,1),btnPulse 1.9s ease-in-out 0.6s infinite;
  }
  .sticky-cta button.unlocked:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 var(--accent-dark),0 6px 16px -4px rgba(255,45,85,.45);
  }
  .countdown-emoji{display:inline-flex;align-items:center;gap:7px}
  .countdown-emoji .lock-icon-big{
    color:#fff;
    opacity:.95;
    flex-shrink:0;
    margin-right:1px;
  }
  .countdown-num{
    background:rgba(255,255,255,.28);
    padding:3px 9px;border-radius:var(--radius-pill);
    font-size:13px;font-weight:800;min-width:46px;
    text-align:center;letter-spacing:.02em;
    font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  }

  /* Comments side button — clean circular icon */
  .sticky-cta .btn-comments{
    flex:0 0 52px;
    width:52px;
    height:52px;
    padding:0;
    background:linear-gradient(135deg, #fff0f3 0%, #ffe1e7 100%);
    color:var(--ink);
    border:1.5px solid rgba(255,45,85,.25);
    border-radius:50%;
    box-shadow:
      0 4px 0 rgba(255,45,85,.25),
      0 6px 16px -4px rgba(255,45,85,.3),
      inset 0 1px 0 rgba(255,255,255,.8);
    cursor:pointer;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    transition:transform .15s, box-shadow .15s;
    align-self:center;
    animation:commentsWiggle 3.5s ease-in-out infinite;
  }
  @keyframes commentsWiggle{
    0%, 90%, 100%{transform:rotate(0deg)}
    93%{transform:rotate(-8deg)}
    96%{transform:rotate(8deg)}
  }
  .sticky-cta .btn-comments:active{
    transform:translateY(2px) rotate(0deg);
    box-shadow:0 2px 0 rgba(255,45,85,.25);
    animation:none;
  }
  .sticky-cta .btn-comments svg{
    width:23px;height:23px;
    color:var(--accent);
    fill:none;stroke:currentColor;stroke-width:2.4;
    stroke-linecap:round;stroke-linejoin:round;
  }
  .sticky-cta .btn-comments .badge-dot{
    position:absolute;
    top:2px;right:2px;
    min-width:18px;
    height:18px;
    padding:0 5px;
    background:var(--accent);
    color:#fff;
    border-radius:100px;
    border:2px solid #fff;
    font-size:9px;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
    box-shadow:0 2px 6px -1px rgba(255,45,85,.5);
    animation:badgeBump 1.6s ease-in-out infinite;
  }
  @keyframes badgeBump{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.12)}
  }

  /* ============ NOTIFICATIONS — bottom-right corner ============ */
  .notif-stack{
    position:fixed;
    right:12px;
    bottom:84px;
    width:auto;
    pointer-events:none !important;
    z-index:45;
    touch-action:none;
  }
  .notif-stack *{pointer-events:none !important}
  .notif{
    position:relative;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-radius:14px;padding:8px 12px;
    display:flex;align-items:center;gap:9px;
    box-shadow:0 8px 26px -8px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.06),inset 0 1px 0 rgba(255,255,255,.6);
    border:1px solid rgba(0,0,0,.04);
    width:240px;
    opacity:0;
    transform:translateX(30px) scale(.95);
    animation:notifInRight 3s ease forwards;
    pointer-events:none;
  }
  @keyframes notifInRight{
    0%{opacity:0;transform:translateX(30px) scale(.95)}
    12%,75%{opacity:1;transform:translateX(0) scale(1)}
    100%{opacity:0;transform:translateX(20px) scale(.97)}
  }
  .notif-avatar{
    width:30px;height:30px;border-radius:50%;
    background-size:cover;background-position:center;
    flex-shrink:0;position:relative;
  }
  .notif-avatar::after{
    content:&quot;&quot;;position:absolute;right:-2px;bottom:-2px;
    width:13px;height:13px;background:var(--green);
    border-radius:50%;border:2px solid #fff;
    background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z'/></svg>&quot;);
    background-size:9px;background-position:center;background-repeat:no-repeat;
  }
  .notif-body{flex:1;min-width:0}
  .notif-title{
    font-size:11.5px;font-weight:700;color:#111;line-height:1.2;
    margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .notif-title .amount{color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums}
  .notif-sub{font-size:9.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .notif-sub .live-dot-mini{
    width:5px;height:5px;background:var(--green);border-radius:50%;
    animation:livePulse 1.4s ease-in-out infinite;
  }

  /* ============ RESPONSIVE SYSTEM ============
     Strategy:
     - Mobile (<600px): full edge-to-edge, classic mobile landing
     - Tablet (600-1024px): card centered with backdrop, max 460px
     - Desktop (>1024px): card centered with rich backdrop, max 460px
  ============ */

  /* Tiny phones (iPhone SE, old Galaxy: <= 360px) */
  @media (max-width:360px){
    body{padding:55px 10px 92px}
    .balance-card{padding:12px 14px}
    .balance-amount{font-size:22px}
    .btn-withdraw{padding:7px 12px;font-size:11px;min-width:68px}
    .hero-card{padding:12px 12px 10px}
    .hero-card h1{font-size:15px}
    .action-bar .msg{font-size:11px}
    .vsl-frame{aspect-ratio:9/12}
    .play-btn{width:54px;height:54px}
    .scroll-cue-bold{padding:9px 10px}
    .cue-text{font-size:11px}
    .cue-arrow-mini{width:24px;height:24px}
    .comments-teaser{padding:12px 12px 6px}
    .teaser-head .title{font-size:14px}
    .c-text{font-size:12px}
    .c-image{max-width:80%}
    .sticky-cta button{padding:13px;font-size:13px}
    .sticky-cta button.unlocked{font-size:15px}
    .sticky-cta{padding:8px;gap:6px}
    .sticky-cta .btn-comments{flex:0 0 44px;width:44px;height:44px}
    .sticky-cta .btn-comments svg{width:19px;height:19px}
    .sticky-cta .btn-comments .badge-dot{min-width:16px;height:16px;font-size:8px}
    .top-status{padding:8px 10px;gap:6px}
    .tt-logo-wrap{font-size:11px;padding-right:6px;gap:4px}
    .tt-logo-wrap svg{width:16px;height:16px}
    .top-status-icon{width:20px;height:20px}
    .top-status-text strong{font-size:8px;letter-spacing:.1em}
    .top-status-text{font-size:9.5px}
    .timer-digit{font-size:10px;padding:3px 5px;min-width:20px}
    .timer-sep{font-size:10px}
    .notif{width:200px;font-size:11px}
  }

  /* Small phones (iPhone Mini, Pixel 5: 361-390px) */
  @media (min-width:361px) and (max-width:390px){
    body{padding:58px 12px 95px}
    .balance-amount{font-size:24px}
    .hero-card h1{font-size:16px}
    .vsl-frame{aspect-ratio:9/12}
  }

  /* Medium phones (iPhone 13/14/15, Pro: 391-414px) — default */

  /* Large phones (iPhone Pro Max, Galaxy Ultra: 415-599px) */
  @media (min-width:415px) and (max-width:599px){
    body{padding:62px 16px 100px}
    .balance-amount{font-size:28px}
    .hero-card h1{font-size:18px}
    .play-btn{width:72px;height:72px}
  }

  /* ============ TABLETS &amp; DESKTOP (>= 600px) ============
     Page becomes a centered card with rich backdrop around it */
  @media (min-width:600px){
    html{
      background:
        radial-gradient(circle at 15% 25%, rgba(255,45,85,.08), transparent 35%),
        radial-gradient(circle at 85% 75%, rgba(255,200,50,.06), transparent 40%),
        #ececef;
      min-height:100vh;
    }
    body{
      max-width:460px;
      margin:24px auto;
      padding:60px 14px 100px;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, var(--accent-glow), transparent 60%),
        var(--bg);
      box-shadow:
        0 30px 80px -20px rgba(0,0,0,.25),
        0 4px 16px -4px rgba(0,0,0,.1);
      border-radius:32px;
      min-height:calc(100vh - 48px);
    }
    /* Fixed bars become absolute (relative to body card) on tablet/desktop */
    .top-status{
      position:absolute;
      left:0;right:0;
      max-width:none;
      width:auto;
      margin:0;
      border-radius:32px 32px 0 0;
      top:0;
      transform:none;
    }
    .sticky-cta{
      position:absolute;
      left:0;right:0;
      bottom:0;

    padding:20px 18px;
    margin-top:10px;
    box-shadow:var(--shadow-card);
  }
  .wc-title{
    font-size:22px;
    font-weight:800;
    letter-spacing:-.025em;
    line-height:1.1;
    margin-bottom:14px;
  }

  /* ============ PAYMENT METHOD GRID ============ */
  .section-label{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:11px;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .section-label .meta{
    color:#3a3a3f;
    font-weight:600;
    text-transform:none;
    letter-spacing:-.005em;
    font-size:11.5px;
    display:flex;align-items:center;gap:4px;
  }
  .section-label .meta .dot{
    width:5px;height:5px;background:var(--green);border-radius:50%;
    box-shadow:0 0 4px var(--green);
  }

  .pm-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    margin-bottom:18px;
  }
  .pm-card{
    background:#fff;
    border:1.5px solid var(--field-border);
    border-radius:14px;
    padding:12px 8px 10px;
    cursor:pointer;
    transition:all .25s cubic-bezier(.34,1.56,.64,1);
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    text-align:center;
    overflow:hidden;
  }
  .pm-card:active{transform:scale(.97)}
  .pm-card.active{
    background:#fff;
    border-color:var(--accent);
    box-shadow:
      0 0 0 3px rgba(255,45,85,.12),
      0 4px 12px -4px rgba(255,45,85,.18);
  }
  .pm-card.active::after{
    content:&quot;&quot;;
    position:absolute;
    top:6px;right:6px;
    width:16px;height:16px;
    background:var(--accent);
    border-radius:50%;
    background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>&quot;);
    background-size:11px;
    background-position:center;
    background-repeat:no-repeat;
  }
  .pm-card-icon{
    width:38px;
    height:38px;
    border-radius:10px;
    display:grid;
    place-items:center;
    flex-shrink:0;
    box-shadow:0 1px 0 rgba(0,0,0,.04);
  }
  .pm-card-icon.cashapp{background:#000;color:#fff;font-weight:800;font-size:22px;font-family:var(--font-body)}
  .pm-card-icon.paypal{background:#fff;border:1.5px solid #e8e8eb}
  .pm-card-icon.paypal svg{width:22px;height:22px}
  .pm-card-icon.venmo{background:#3D95CE;color:#fff}
  .pm-card-icon.venmo svg{width:22px;height:22px;fill:#fff}
  .pm-card-icon.zelle{background:#6d1ed4;color:#fff;font-weight:800;font-size:22px;font-style:italic;font-family:Georgia,serif}
  .pm-card-icon.wire{
    background:linear-gradient(135deg,#3a3a3f,#1f1f23);
    color:#fff;
    position:relative;
  }
  .pm-card-icon.wire svg{
    width:22px;height:22px;
    stroke:currentColor;stroke-width:2;fill:none;
    stroke-linecap:round;stroke-linejoin:round;
  }
  .pm-card-icon.ach{background:#f4f4f6;color:var(--ink)}
  .pm-card-icon.ach svg{width:22px;height:22px;fill:currentColor}

  .pm-card-name{
    font-size:12.5px;
    font-weight:700;
    letter-spacing:-.015em;
    color:var(--ink);
    line-height:1.1;
  }
  .pm-card-badge{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-size:9px;
    font-weight:700;
    color:#0f7a35;
    background:var(--green-soft);
    padding:2px 6px;
    border-radius:100px;
    letter-spacing:.02em;
    text-transform:uppercase;
  }
  .pm-card-badge.slow{
    color:#5a5a60;
    background:#f0f0f3;
  }
  .pm-card-badge .lightning{
    width:8px;height:8px;
    color:currentColor;
    flex-shrink:0;
  }

  /* Amount selector */
  .amounts-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:14px;
  }
  .amount-btn{
    background:#f4f4f6;
    border:1.5px solid transparent;
    color:var(--ink);
    padding:13px 4px;
    border-radius:var(--radius-input);
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    transition:all .2s cubic-bezier(.34,1.56,.64,1);
    letter-spacing:-.025em;
    font-variant-numeric:tabular-nums;
    font-family:var(--font-body);
  }
  .amount-btn:active{transform:scale(.96)}
  .amount-btn.active{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent);
    box-shadow:0 0 0 3px rgba(255,45,85,.12);
  }

  /* Selected payment method card */
  .selected-pm{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px;
    background:var(--field);
    border:1px solid var(--field-border);
    border-radius:var(--radius-input);
    margin-bottom:12px;
  }
  .selected-pm-icon{
    width:42px;height:42px;
    background:#000;
    color:#fff;
    border-radius:10px;
    display:grid;place-items:center;
    font-weight:800;
    font-size:22px;
    flex-shrink:0;
  }
  .selected-pm-body{flex:1;min-width:0}
  .selected-pm-name{
    font-size:15px;
    font-weight:700;
    letter-spacing:-.015em;
    line-height:1.2;
  }
  .selected-pm-sub{
    font-size:12px;
    color:var(--muted);
    margin-top:1px;
    display:flex;align-items:center;gap:5px;
  }
  .selected-pm-sub .badge-instant{
    background:var(--green-soft);
    color:#0f7a35;
    padding:1.5px 6px;
    border-radius:100px;
    font-weight:700;
    font-size:10px;
    letter-spacing:.02em;
    text-transform:uppercase;
  }
  .selected-pm-change{
    background:transparent;
    border:none;
    color:var(--accent);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    padding:6px 10px;
    border-radius:8px;
    transition:background .2s;
    font-family:inherit;
  }
  .selected-pm-change:active{background:var(--accent-soft)}

  /* Connect Payment Form */
  .form-card{
    background:var(--field);
    border:1px solid var(--field-border);
    border-radius:var(--radius-input);
    padding:16px;
    margin-bottom:14px;
  }
  .form-card-title{
    font-size:15px;
    font-weight:800;
    letter-spacing:-.015em;
    margin-bottom:14px;
  }
  .form-field{margin-bottom:12px}
  .form-field:last-child{margin-bottom:14px}
  .form-label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:5px;
    letter-spacing:-.005em;
  }
  .form-input{
    width:100%;
    background:#fff;
    border:1.5px solid var(--field-border);
    border-radius:10px;
    padding:12px 14px;
    font-size:14px;
    font-weight:500;
    color:var(--ink);
    transition:all .2s;
    font-family:inherit;
    letter-spacing:-.005em;
  }
  .form-input::placeholder{color:#a8a8ad;font-weight:400}
  .form-input:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(255,45,85,.1);
  }
  /* validation states */
  .form-input.valid{
    border-color:#16a34a;
    background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2316a34a' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>&quot;);
    background-repeat:no-repeat;
    background-position:right 14px center;
    background-size:14px;
    padding-right:38px;
  }
  .form-input.invalid{
    border-color:#dc2626;
    background:#fef2f2;
  }
  .form-error{
    font-size:11.5px;
    color:#dc2626;
    margin-top:5px;
    font-weight:600;
    line-height:1.3;
    display:none;
    align-items:flex-start;
    gap:4px;
    letter-spacing:-.005em;
  }
  .form-error.show{display:flex}
  .form-error::before{
    content:&quot;⚠&quot;;
    font-size:11px;
    flex-shrink:0;
  }
  select.form-input{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2386868b' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>&quot;);
    background-repeat:no-repeat;
    background-position:right 14px center;
    background-size:14px;
    padding-right:40px;
    cursor:pointer;
    height:46px;
    line-height:1;
    color:var(--ink);
    font-weight:600;
  }
  select.form-input:invalid,
  select.form-input option[disabled]{color:#a8a8ad}
  select.form-input option{
    color:var(--ink);
    background:#fff;
    padding:10px;
    font-weight:500;
  }

  /* SUBMIT button */
  .btn-submit{
    width:100%;
    background:linear-gradient(180deg,#ff4566,#ff2d55);
    color:#fff;
    border:none;
    padding:15px;
    border-radius:var(--radius-btn);
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    box-shadow:
      0 4px 0 var(--accent-dark),
      0 8px 20px -4px rgba(255,45,85,.4),
      inset 0 1px 0 rgba(255,255,255,.2);
    transition:all .15s;
    letter-spacing:-.005em;
    font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-submit:active{
    transform:translateY(2px);
    box-shadow:0 2px 0 var(--accent-dark),0 4px 12px -4px rgba(255,45,85,.3);
  }
  .btn-submit svg{
    width:16px;height:16px;
    stroke:currentColor;stroke-width:2.4;fill:none;
    stroke-linecap:round;stroke-linejoin:round;
  }

  /* footer info inside withdraw card */
  .wc-footer{
    margin-top:18px;
    padding-top:14px;
    border-top:1px solid var(--line-soft);
    text-align:center;
  }
  .wc-footer p{
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
    letter-spacing:-.005em;
  }
  .wc-footer p + p{margin-top:6px}
  .wc-footer strong{color:#3a3a3f;font-weight:700}

  /* ============ TRUST BADGES SECTION ============ */
  .trust-row{
    margin-top:14px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .trust-card{
    background:var(--card);
    border-radius:14px;
    padding:14px 10px;
    text-align:center;
    box-shadow:var(--shadow-card);
    position:relative;
    overflow:hidden;
  }
  .trust-card .ico{
    width:34px;height:34px;
    margin:0 auto 6px;
    background:var(--accent-soft);
    color:var(--accent);
    border-radius:10px;
    display:grid;place-items:center;
  }
  .trust-card .ico svg{
    width:18px;height:18px;
    stroke:currentColor;stroke-width:2.2;fill:none;
    stroke-linecap:round;stroke-linejoin:round;
  }
  .trust-card .ttl{
    font-size:11px;
    font-weight:800;
    color:var(--ink);
    line-height:1.15;
    letter-spacing:-.01em;
  }
  .trust-card .sub{
    font-size:9.5px;
    color:var(--muted);
    margin-top:3px;
    font-weight:500;
    letter-spacing:-.005em;
  }

  /* ============ RECENT PAYOUTS LIST ============ */
  .payouts-card{
    background:var(--card);
    border-radius:var(--radius-card);
    padding:16px;
    margin-top:10px;
    box-shadow:var(--shadow-card);
  }
  .payouts-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
  }
  .payouts-head h3{
    font-size:14px;
    font-weight:800;
    letter-spacing:-.02em;
    display:flex;align-items:center;gap:6px;
  }
  .payouts-head .live-tag{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:10px;
    color:var(--green);
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
  }
  .payouts-head .live-tag .dot{
    width:6px;height:6px;background:var(--green);border-radius:50%;
    animation:livePulse 1.4s ease-in-out infinite;
    box-shadow:0 0 5px var(--green);
  }
  .payout{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .payout:last-child{border-bottom:none}
  .payout-avatar{
    width:32px;height:32px;
    border-radius:50%;
    background-size:cover;background-position:center;
    flex-shrink:0;
    box-shadow:0 1px 0 rgba(0,0,0,.04);
  }
  .payout-body{flex:1;min-width:0}
  .payout-name{
    font-size:13px;
    font-weight:700;
    letter-spacing:-.01em;
    line-height:1.15;
  }
  .payout-meta{
    font-size:10.5px;
    color:var(--muted);
    margin-top:1px;
    letter-spacing:-.005em;
  }
  .payout-amt{
    font-size:13px;
    font-weight:800;
    color:var(--green);
    letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;
  }

  /* ============ FAQ ============ */
  .faq-card{
    background:var(--card);
    border-radius:var(--radius-card);
    padding:18px 16px 8px;
    margin-top:10px;
    box-shadow:var(--shadow-card);
  }
  .faq-head{
    font-size:14px;
    font-weight:800;
    letter-spacing:-.02em;
    margin-bottom:6px;
    display:flex;align-items:center;gap:6px;
  }
  .faq-head .q-icon{
    width:22px;height:22px;
    background:var(--accent-soft);
    color:var(--accent);
    border-radius:50%;
    display:grid;place-items:center;
    font-size:13px;
    font-weight:800;
  }
  .faq-item{
    border-bottom:1px solid var(--line-soft);
  }
  .faq-item:last-child{border-bottom:none}
  .faq-q{
    width:100%;
    background:transparent;
    border:none;
    padding:12px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    text-align:left;
    font-family:inherit;
    letter-spacing:-.01em;
    gap:10px;
  }
  .faq-q .chev{
    width:18px;height:18px;
    flex-shrink:0;
    transition:transform .25s;
    color:var(--muted);
  }
  .faq-q .chev svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .faq-item.open .faq-q .chev{transform:rotate(180deg)}
  .faq-a{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease, padding .25s;
    color:var(--muted);
    font-size:12.5px;
    line-height:1.55;
    letter-spacing:-.005em;
  }
  .faq-item.open .faq-a{
    max-height:200px;
    padding:0 0 14px;
  }

  /* ============ FOOTER ============ */
  .legal-footer{
    margin-top:14px;
    padding:18px 14px;
    background:var(--card);
    border-radius:var(--radius-card);
    box-shadow:var(--shadow-card);
    text-align:center;
  }
  .legal-logos{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .legal-logo{
    height:22px;
    color:#5a5a60;
    font-weight:700;
    font-size:10.5px;
    letter-spacing:.04em;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .legal-logo svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

  .legal-links{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:4px 12px;
    margin-bottom:12px;
    font-size:11px;
  }
  .legal-links a{
    color:#5a5a60;
    text-decoration:none;
    font-weight:600;
    letter-spacing:-.005em;
  }
  .legal-links a:active{color:var(--ink)}
  .legal-disclaimer{
    font-size:9.5px;
    color:var(--muted);
    line-height:1.6;
    max-width:340px;
    margin:0 auto;
    padding-top:12px;
    border-top:1px solid var(--line-soft);
  }
  .legal-disclaimer strong{color:#4a4a4f;font-weight:700}

  .footer-brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin:8px 0 14px;
    font-size:15px;
    font-weight:800;
    color:var(--ink);
    letter-spacing:-.02em;
    padding-top:12px;
    border-top:1px solid var(--line-soft);
  }
  .footer-tt-logo{
    width:20px;height:20px;
    color:var(--ink);
  }

  /* ============ MODAL — Add Withdrawal Method ============ */
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    z-index:200;
    display:none;
    align-items:flex-end;
    justify-content:center;
  }
  .modal-backdrop.open{display:flex;animation:fadeIn .25s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{
    background:#fff;
    width:100%;
    max-width:430px;
    border-radius:24px 24px 0 0;
    padding:22px 18px 28px;
    animation:slideUp .35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    padding-bottom:12px;
    border-bottom:1px solid var(--line-soft);
  }
  .modal-head h3{
    font-size:18px;
    font-weight:800;
    letter-spacing:-.02em;
  }
  .modal-close{
    background:transparent;
    border:none;
    width:34px;height:34px;
    border-radius:50%;
    display:grid;place-items:center;
    cursor:pointer;
    color:var(--muted);
  }
  .modal-close svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .modal-close:active{background:#f3f3f5}

  .pm-list-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 8px;
    border-radius:12px;
    cursor:pointer;
    transition:background .2s;
  }
  .pm-list-item:active{background:#f7f7f9}
  .pm-list-icon{
    width:44px;height:44px;
    border-radius:11px;
    display:grid;place-items:center;
    flex-shrink:0;
  }
  .pm-list-icon.ca{background:#000;color:#fff;font-weight:800;font-size:24px}
  .pm-list-icon.pp{background:#fff;border:1.5px solid #e8e8eb;color:#003087}
  .pm-list-icon.ve{background:#fff;border:1.5px solid #e8e8eb;color:#008cff;font-style:italic;font-weight:800;font-size:14px}
  .pm-list-icon.ze{background:#fff;border:1.5px solid #e8e8eb;color:#6d1ed4;font-weight:800;font-size:24px;font-style:italic}
  .pm-list-icon.wi{background:linear-gradient(135deg,#3a3a3f,#1f1f23);color:#fff}
  .pm-list-icon.wi svg{width:22px;height:22px}
  .pm-list-icon.ba{background:#f4f4f6;color:var(--ink)}
  .pm-list-icon.ba svg{width:24px;height:24px;fill:currentColor}
  .pm-list-body{flex:1;min-width:0}
  .pm-list-name{
    font-size:15px;
    font-weight:700;
    letter-spacing:-.015em;
    line-height:1.2;
  }
  .pm-list-sub{
    font-size:11.5px;
    color:var(--muted);
    margin-top:2px;
    display:flex;align-items:center;gap:5px;
  }
  .pm-list-sub .badge{
    background:var(--green-soft);
    color:#0f7a35;
    padding:1px 6px;
    border-radius:100px;
    font-weight:700;
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:.02em;
  }
  .pm-list-arrow{
    color:var(--muted);
    width:18px;height:18px;
    flex-shrink:0;
  }
  .pm-list-arrow svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}

  /* ============ CHATBOT MODAL ============ */
  .chat-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    z-index:250;
    display:none;

  .chat-body{

  /* CTA inline inside bot message — persuasive */
  .chat-cta{

    justify-content:center;

  /* ============ TOAST ============ */
  .toast{

    bottom:24px;

  /* ============ RESPONSIVE ============ */
  @media (min-width:600px){

        radial-gradient(circle at 15% 25%, rgba(255,45,85,.08), transparent 35%),

  .scroll-hint{

      error: 'Username must have 5–30 characters (letters/numbers)'
    },
    usPhone: {
      test: v => {
        const digits = v.replace(/\D/g, '');
        return digits.length === 10 || (digits.length === 11 &amp;&amp; digits.startsWith('1'));
      },
      error: 'Please enter a valid 10-digit US phone number'
    },
    emailOrPhone: {
      test: v => {
        const s = v.trim();
        if(/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s)) return true;
        const digits = s.replace(/\D/g, '');
        return digits.length === 10 || (digits.length === 11 &amp;&amp; digits.startsWith('1'));

      error: 'Enter a valid US email or phone number'

      test: v => /^\d{9}$/.test(v.replace(/\D/g, '')),
      error: 'Routing number must be exactly 9 digits'

      test: v => {
        const d = v.replace(/\D/g, '');
        return d.length >= 4 &amp;&amp; d.length <= 17;
      },
      error: 'Account number must be 4–17 digits'
    },
    swift: {
      test: v => {
        const s = v.trim();
        if(!s) return true; // optional
        return /^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$/i.test(s);
      },
      error: 'Invalid SWIFT/BIC format (8 or 11 characters)'

  // ============ VALIDATE A FIELD ============
  function validateField(inp, idx, showErrorIfEmpty){
    const validatorKey = inp.dataset.validator;
    const optional = inp.dataset.optional === '1';
    const val = inp.value;
    const errEl = document.getElementById('err_' + idx);

    // empty handling
    if(!val.trim()){
      if(optional){
        inp.classList.remove('invalid','valid');
        if(errEl) errEl.classList.remove('show');
        return true;
      }
      if(showErrorIfEmpty){
        inp.classList.add('invalid');
        inp.classList.remove('valid');
        if(errEl){
          errEl.textContent = 'This field is required';
          errEl.classList.add('show');
        }
      }
      return false;
    }

    if(!validatorKey || !validators[validatorKey]){
      // no validator → considered valid if not empty
      inp.classList.add('valid');
      inp.classList.remove('invalid');
      if(errEl) errEl.classList.remove('show');
      return true;
    }

    const v = validators[validatorKey];
    const ok = v.test(val);
    if(ok){
      inp.classList.add('valid');
      inp.classList.remove('invalid');
      if(errEl) errEl.classList.remove('show');
      return true;
    } else {
      inp.classList.add('invalid');
      inp.classList.remove('valid');
      if(errEl){
        errEl.textContent = v.error;
        errEl.classList.add('show');
      }
      return false;
    }
  }

    }
  } catch(e){}

  }
  .nav-title .tt-logo{
    width:20px;height:20px;
    flex-shrink:0;
    color:var(--ink);
  }
  .nav-title .sep-dot{
    width:3px;height:3px;
    background:#c4c4c8;
    border-radius:50%;
    margin:0 2px;
  }
  .nav-title .reward-txt{
    font-weight:600;
    color:#5a5a60;
    font-size:13px;
    letter-spacing:-.01em;
  }

  /* ============ STATUS BANNER — sticky urgency strip ============ */
  .status-banner{
    position:sticky;
    top:10px;
    z-index:50;
    background:linear-gradient(90deg,#fef9c3 0%,#fef6e0 100%);
    border:1px solid #fcd34d;
    border-radius:14px;
    padding:11px 14px;
    margin:0 0 16px;
    display:flex;
    align-items:center;
    gap:10px;
    animation:fadeSlide .5s ease;
    box-shadow:
      0 10px 28px -6px rgba(252,211,77,.35),
      0 4px 10px -2px rgba(0,0,0,.08),
      0 1px 0 rgba(255,255,255,.6) inset;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  @keyframes fadeSlide{
    from{opacity:0;transform:translateY(-6px)}
    to{opacity:1;transform:translateY(0)}
  }
  .status-icon-wrap{
    width:32px;height:32px;
    background:#fef3c7;
    border:1px solid #fcd34d;
    border-radius:8px;
    display:grid;place-items:center;
    flex-shrink:0;
    color:#92400e;
    position:relative;
  }
  .status-icon-wrap::after{
    content:&quot;&quot;;
    position:absolute;
    inset:-2px;
    border-radius:10px;
    border:2px solid rgba(252,211,77,.5);
    animation:pulseRing 1.8s ease-in-out infinite;
  }
  @keyframes pulseRing{
    0%,100%{transform:scale(1);opacity:.6}
    50%{transform:scale(1.15);opacity:0}
  }
  .status-icon-wrap svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .status-banner-text{flex:1;min-width:0}
  .status-banner-title{
    font-size:12px;
    font-weight:800;
    color:#78350f;
    letter-spacing:-.005em;
    line-height:1.2;
  }
  .status-banner-sub{
    font-size:11px;
    color:#a16207;
    margin-top:1px;
    font-weight:500;
    letter-spacing:-.005em;
  }
  .status-banner-timer{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:13px;
    color:#78350f;
    background:#fef3c7;
    padding:4px 8px;
    border-radius:6px;
    border:1px solid #fcd34d;
    flex-shrink:0;
    font-variant-numeric:tabular-nums;
  }

  /* ============ BALANCE HERO CARD ============ */
  .balance-hero{
    background:linear-gradient(155deg, #0a0a0c 0%, #1f1f23 50%, #2a1a1f 100%);
    color:#fff;
    border-radius:var(--radius-card);
    padding:20px 22px;
    margin-bottom:10px;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 30px -10px rgba(0,0,0,.35);
  }
  .balance-hero::before{
    content:&quot;&quot;;
    position:absolute;
    top:-50px;right:-40px;
    width:180px;height:180px;
    background:radial-gradient(circle, rgba(255,45,85,.18), transparent 70%);
    pointer-events:none;
  }
  .balance-hero::after{
    content:&quot;&quot;;
    position:absolute;
    bottom:-30px;left:-30px;
    width:140px;height:140px;
    background:radial-gradient(circle, rgba(245,184,11,.08), transparent 70%);
    pointer-events:none;
  }
  .bh-tag{
    font-size:10px;
    font-weight:800;
    color:rgba(255,255,255,.55);
    letter-spacing:.14em;
    text-transform:uppercase;
    margin-bottom:6px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .bh-tag .dot{
    width:5px;height:5px;
    background:#fbbf24;
    border-radius:50%;
    animation:pulseLed 1.4s ease-in-out infinite;
    box-shadow:0 0 6px #fbbf24;
  }
  @keyframes pulseLed{
    0%,100%{opacity:1}
    50%{opacity:.4}
  }
  .bh-amount{
    font-family:var(--font-body);
    font-size:38px;
    font-weight:800;
    letter-spacing:-.03em;
    line-height:1;
    font-variant-numeric:tabular-nums;
    margin-bottom:8px;
    position:relative;
    z-index:1;
  }
  .bh-amount .cur{
    font-size:38px;
    font-weight:800;
    margin-right:2px;
    color:#fff;
    vertical-align:baseline;
    top:0;
    position:static;
  }
  .bh-status{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    color:rgba(255,255,255,.75);
    font-weight:500;
    letter-spacing:-.005em;
  }
  .bh-status .lock-ico{
    width:14px;height:14px;
    color:#fbbf24;
    flex-shrink:0;
  }
  .bh-status .lock-ico svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}

  /* hold seal in top-right */
  .bh-seal{
    position:absolute;
    top:14px;right:14px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    padding:5px 10px;
    border-radius:100px;
    font-size:10px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:rgba(255,255,255,.9);
    display:flex;
    align-items:center;
    gap:5px;
  }
  .bh-seal .seal-dot{
    width:5px;height:5px;
    background:#10b981;
    border-radius:50%;
    box-shadow:0 0 5px #10b981;
  }

  /* ============ IRS REQUIREMENT CARD ============ */
  .irs-card{
    background:var(--card);
    border-radius:var(--radius-card);
    padding:18px 18px 16px;
    margin-bottom:10px;
    box-shadow:var(--shadow-card);
    border:1px solid rgba(28,58,94,.08);
    position:relative;
    overflow:hidden;
  }
  .irs-card::before{
    content:&quot;&quot;;
    position:absolute;
    top:0;left:0;right:0;
    height:3px;
    background:linear-gradient(90deg, var(--gov-blue), var(--accent), var(--gov-blue));
  }
  .irs-header{
    display:flex;
    align-items:flex-start;
    gap:12px;
    margin-bottom:14px;
  }
  .irs-badge{
    width:46px;height:46px;
    background:linear-gradient(180deg, var(--gov-blue) 0%, #142c47 100%);
    color:#fff;
    border-radius:11px;
    display:grid;place-items:center;
    flex-shrink:0;
    box-shadow:
      0 4px 10px -3px rgba(28,58,94,.4),
      inset 0 1px 0 rgba(255,255,255,.15);
    position:relative;
  }
  .irs-badge svg{width:24px;height:24px;color:#fff;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .irs-badge::after{
    content:&quot;&quot;;
    position:absolute;
    inset:-1px;
    border-radius:12px;
    background:linear-gradient(135deg, rgba(255,255,255,.2), transparent);
    pointer-events:none;
  }
  .irs-header-text{flex:1;min-width:0}
  .irs-title{
    font-family:var(--font-display);
    font-size:18px;
    font-weight:700;
    letter-spacing:-.02em;
    line-height:1.2;
    color:var(--ink);
  }
  .irs-subtitle{
    font-size:11px;
    color:var(--gov-blue);
    font-weight:700;
    margin-top:3px;
    letter-spacing:.04em;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .irs-subtitle::after{
    content:&quot;&quot;;
    flex:1;
    height:1px;
    background:linear-gradient(90deg, rgba(28,58,94,.2), transparent);
  }

  .irs-amount-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    padding:14px 14px;
    background:linear-gradient(135deg, rgba(255,45,85,.04) 0%, rgba(28,58,94,.03) 100%);
    border:1px solid rgba(255,45,85,.15);
    border-radius:12px;
    margin-bottom:14px;
  }
  .irs-amount-label{
    font-size:10.5px;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.1em;
    margin-bottom:4px;
  }
  .irs-amount-value{
    font-family:var(--font-body);
    font-size:30px;
    font-weight:800;
    color:var(--accent);
    letter-spacing:-.03em;
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .irs-amount-value .cur{
    font-size:30px;
    font-weight:800;
    margin-right:1px;
    position:static;
    top:0;
  }
  .refundable-badge{
    background:var(--green-soft);
    color:var(--green);
    padding:5px 10px;
    border-radius:100px;
    font-size:10px;
    font-weight:800;
    letter-spacing:.04em;
    text-transform:uppercase;
    display:inline-flex;
    align-items:center;
    gap:4px;
    flex-shrink:0;
    white-space:nowrap;
  }
  .refundable-badge svg{
    width:11px;height:11px;
    stroke:currentColor;stroke-width:3;fill:none;
    stroke-linecap:round;stroke-linejoin:round;
  }

  .irs-explain{
    font-size:13px;
    line-height:1.55;
    color:#3a3a3f;
    letter-spacing:-.005em;
  }
  .irs-explain strong{
    color:var(--ink);
    font-weight:700;
  }
  .irs-explain .accent-strong{
    color:var(--accent);
    font-weight:700;
  }

  /* ============ SUMMARY CARD ============ */
  .summary-card{
    background:var(--card);
    border-radius:var(--radius-card);
    padding:16px 18px;
    margin-bottom:10px;
    box-shadow:var(--shadow-card);
  }
  .summary-header{
    font-size:10.5px;
    font-weight:800;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.1em;
    margin-bottom:12px;
    padding-bottom:10px;
    border-bottom:1px dashed var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .summary-edit{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:var(--accent-soft);
    color:var(--accent);
    padding:5px 10px 5px 8px;
    border-radius:100px;
    font-size:10.5px;
    font-weight:800;
    text-decoration:none;
    letter-spacing:.04em;
    text-transform:uppercase;
    border:1px solid rgba(255,45,85,.18);
    transition:all .15s;
    font-family:inherit;
    cursor:pointer;
  }
  .summary-edit:hover{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  .summary-edit:active{
    transform:scale(.95);
  }
  .summary-edit svg{
    width:11px;height:11px;
    stroke:currentColor;stroke-width:2.5;fill:none;
    stroke-linecap:round;stroke-linejoin:round;
  }
  .summary-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line-soft);
    font-size:13px;
    gap:12px;
  }
  .summary-row:last-of-type{border-bottom:none}
  .summary-label{
    color:var(--muted);
    font-weight:500;
    letter-spacing:-.005em;
    flex-shrink:0;
  }
  .summary-value{
    color:var(--ink);
    font-weight:700;
    letter-spacing:-.01em;
    text-align:right;
    word-break:break-word;
    min-width:0;
  }
  .summary-value.amount{
    font-family:var(--font-body);
    font-size:20px;
    font-weight:800;
    letter-spacing:-.025em;
    font-variant-numeric:tabular-nums;
  }
  .summary-row.totals{
    background:linear-gradient(135deg, #fafafb, var(--field));
    margin:8px -18px -16px;
    padding:14px 18px;
    border-bottom:none;
    border-radius:0 0 var(--radius-card) var(--radius-card);
    border-top:1px solid var(--line);
  }
  .summary-row.totals .summary-label{
    font-weight:700;
    color:var(--ink);
    font-size:13.5px;
    text-transform:none;
    letter-spacing:-.005em;
  }
  .summary-row.totals .summary-value{
    color:var(--accent);
    font-size:20px;
  }

  /* ============ PROCESS STEPS ============ */
  .steps-card{
    background:var(--card);
    border-radius:var(--radius-card);
    padding:16px 18px 14px;
    margin-bottom:10px;
    box-shadow:var(--shadow-card);
  }
  .steps-title{
    font-size:10.5px;
    font-weight:800;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.1em;
    margin-bottom:14px;
    display:flex;align-items:center;gap:6px;
  }
  .steps-title::after{
    content:&quot;&quot;;flex:1;height:1px;background:var(--line-soft);
  }
  .step{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:9px 0;
    position:relative;
  }
  .step + .step{
    border-top:1px solid var(--line-soft);
    padding-top:11px;
    margin-top:2px;
  }
  .step-num{
    width:26px;height:26px;
    border-radius:50%;
    display:grid;place-items:center;
    flex-shrink:0;
    font-size:12px;
    font-weight:800;
    font-family:var(--font-body);
    letter-spacing:-.01em;
  }
  .step.pending .step-num{
    background:var(--accent-soft);
    color:var(--accent);
    border:1.5px solid rgba(255,45,85,.25);
  }
  .step.complete .step-num{
    background:var(--green-soft);
    color:var(--green);
    border:1.5px solid rgba(15,122,53,.25);
  }
  .step.future .step-num{
    background:var(--field);
    color:var(--muted);
    border:1.5px solid var(--line);
  }
  .step-num svg{width:14px;height:14px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .step-body{flex:1;min-width:0}
  .step-title{
    font-size:13.5px;
    font-weight:700;
    letter-spacing:-.01em;
    line-height:1.3;
  }
  .step.complete .step-title{color:var(--green)}
  .step-desc{
    font-size:11.5px;
    color:var(--muted);
    margin-top:2px;
    line-height:1.4;
    letter-spacing:-.005em;
  }

  /* ============ CTA INLINE (after release process) ============ */
  .cta-card{
    background:var(--card);
    border-radius:var(--radius-card);
    padding:16px;
    margin-bottom:10px;
    box-shadow:var(--shadow-elev);
  }

  /* ============ CTA STICKY BOTTOM ============ */
  .cta-sticky{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:50;
    padding:12px 14px 14px;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-top:1px solid rgba(0,0,0,.06);
    box-shadow:0 -10px 28px -8px rgba(0,0,0,.12);
  }
  /* On tablet/desktop, anchor sticky to the card (centered, with body card width) */
  @media (min-width:600px){
    .cta-sticky{
      position:fixed;
      left:50%;
      right:auto;
      transform:translateX(-50%);
      max-width:460px;
      width:100%;
      bottom:0;
      border-radius:0 0 32px 32px;
    }
  }
  @media (min-width:1024px){
    .cta-sticky{
      max-width:480px;
    }
  }
  .btn-pay{
    width:100%;
    background:linear-gradient(180deg,#ff4566,#ff2d55);
    color:#fff;
    border:none;
    padding:16px;
    border-radius:var(--radius-btn);
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    box-shadow:
      0 5px 0 var(--accent-dark),
      0 12px 28px -6px rgba(255,45,85,.45),
      inset 0 1px 0 rgba(255,255,255,.2);
    transition:all .15s;
    letter-spacing:-.005em;
    font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:10px;
    position:relative;
    overflow:hidden;
    animation:btnPulse 2s ease-in-out infinite;
  }
  @keyframes btnPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.02)}
  }
  .btn-pay:active{
    transform:translateY(2px) scale(1);
    box-shadow:0 3px 0 var(--accent-dark),0 6px 14px -4px rgba(255,45,85,.3);
    animation:none;
  }
  .btn-pay::before{
    content:&quot;&quot;;
    position:absolute;
    top:0;left:-100%;
    width:50%;height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
    animation:shineBtn 2.4s ease-in-out infinite;
  }
  @keyframes shineBtn{
    0%{left:-100%}
    50%{left:150%}
    100%{left:150%}
  }
  .btn-pay svg{
    width:18px;height:18px;
    stroke:currentColor;stroke-width:2.4;fill:none;
    stroke-linecap:round;stroke-linejoin:round;
  }

  .cta-refund-note{
    margin-top:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-size:11.5px;
    color:var(--green);
    font-weight:700;
    letter-spacing:-.005em;
  }
  .cta-refund-note svg{
    width:13px;height:13px;
    stroke:currentColor;stroke-width:2.5;fill:none;
    stroke-linecap:round;stroke-linejoin:round;
  }

  /* ============ SECURITY ROW ============ */
  .security-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:10px;
  }
  .sec-pill{
    background:var(--card);
    border-radius:12px;
    padding:11px 8px 9px;
    text-align:center;
    box-shadow:var(--shadow-card);
  }
  .sec-pill .ico{
    width:24px;height:24px;
    margin:0 auto 5px;
    color:var(--gov-blue);
    background:var(--gov-blue-soft);
    border-radius:7px;
    display:grid;place-items:center;
  }
  .sec-pill .ico svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .sec-pill .label{
    font-size:10px;
    font-weight:800;
    color:var(--ink);
    letter-spacing:-.005em;
    line-height:1.2;
  }
  .sec-pill .sub{
    font-size:8.5px;
    color:var(--muted);
    margin-top:1px;
    font-weight:600;
    letter-spacing:-.005em;
  }

  /* ============ FAQ ============ */
  .faq-card{
    background:var(--card);
    border-radius:var(--radius-card);
    padding:14px 16px 4px;
    margin-bottom:10px;
    box-shadow:var(--shadow-card);
  }
  .faq-head{
    font-size:13px;
    font-weight:800;
    letter-spacing:-.02em;
    margin-bottom:4px;
    display:flex;align-items:center;gap:6px;
  }
  .faq-head .q-icon{
    width:20px;height:20px;
    background:var(--accent-soft);
    color:var(--accent);
    border-radius:50%;
    display:grid;place-items:center;
    font-size:12px;
    font-weight:800;
  }
  .faq-item{
    border-bottom:1px solid var(--line-soft);
  }
  .faq-item:last-child{border-bottom:none}
  .faq-q{
    width:100%;
    background:transparent;
    border:none;
    padding:11px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    text-align:left;
    font-family:inherit;
    letter-spacing:-.01em;
    gap:10px;
  }
  .faq-q .chev{
    width:16px;height:16px;
    flex-shrink:0;
    transition:transform .25s;
    color:var(--muted);
  }
  .faq-q .chev svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .faq-item.open .faq-q .chev{transform:rotate(180deg)}
  .faq-a{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease, padding .25s;
    color:var(--muted);
    font-size:12px;
    line-height:1.55;
    letter-spacing:-.005em;
  }
  .faq-item.open .faq-a{
    max-height:240px;
    padding:0 0 12px;
  }

  /* ============ LEGAL FOOTER ============ */
  .legal-footer{
    background:var(--card);
    border-radius:var(--radius-card);
    padding:16px 14px 14px;
    text-align:center;
    box-shadow:var(--shadow-card);
  }
  .legal-badges{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }
  .legal-badge{
    color:#5a5a60;
    font-weight:700;
    font-size:10px;
    letter-spacing:.04em;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .legal-badge svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

  .footer-brand{
    display:flex;
