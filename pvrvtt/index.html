<style>
:root {
  --cyan: #25F4EE;
  --pink: #FE2C55;
  --grad: linear-gradient(100deg, #25F4EE, #FE2C55);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #000;
  color: #fff;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

#page-content { display: none; }

/* Gate */
#gate {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 36px 24px calc(36px + env(safe-area-inset-bottom));
  text-align: center;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(37,244,238,.15), transparent 55%),
    radial-gradient(120% 70% at 50% 112%, rgba(254,44,85,.14), transparent 55%),
    #000;
  transition: opacity .55s cubic-bezier(.2,.8,.2,1), transform .55s cubic-bezier(.2,.8,.2,1);
}
#gate.revealed { opacity: 0; transform: scale(1.03); pointer-events: none; }

.gate-title {
  font-size: clamp(22px, 6vw, 30px);
  font-weight: 800; letter-spacing: -.025em; line-height: 1.2;
  max-width: 340px; margin-bottom: 12px;
}
.gate-sub {
  color: rgba(255,255,255,.5);
  font-size: clamp(13px, 3.5vw, 14.5px);
  max-width: 300px; line-height: 1.5;
}

/* Slider */
.slider-wrap { margin-top: 50px; width: min(420px, 88vw); }

.slider {
  position: relative; height: 62px; border-radius: 999px;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.1);
  box-shadow: inset 0 1px 4px rgba(0,0,0,.5);
  overflow: hidden;
  user-select: none; touch-action: none;
}
.slider-fill {
  position: absolute; left: 0; top: 0; height: 100%; width: 0;
  border-radius: 999px;
  background: var(--grad); opacity: .22;
  transition: width .26s cubic-bezier(.2,.8,.2,1);
}
.slider.dragging .slider-fill { transition: none; }
.slider.done .slider-fill { opacity: .32; }

.slider-label {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  color: rgba(255,255,255,.3);
  font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
  pointer-events: none; transition: opacity .2s;
}
.slider.dragging .slider-label,
.slider.done .slider-label { opacity: 0; }

.handle {
  position: absolute; top: 5px; left: 5px;
  width: 52px; height: 52px; border-radius: 999px;
  background: var(--grad);
  display: grid; place-items: center;
  cursor: grab;
  box-shadow: 0 8px 20px rgba(254,44,85,.45), 0 3px 10px rgba(37,244,238,.3);
  transform: translateX(0);
  transition: transform .26s cubic-bezier(.2,.8,.2,1);
  will-change: transform;
}
.slider.dragging .handle { transition: none; cursor: grabbing; }
.handle svg { width: 22px; height: 22px; display: block; }
.handle::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(110deg, transparent 32%, rgba(255,255,255,.5) 50%, transparent 68%);
  background-size: 220% 100%;
  animation: shimmer 2s linear infinite;
  pointer-events: none;
}
@keyframes shimmer { 0% { background-position: 220% 0; } 100% { background-position: -220% 0; } }

.slider-hint {
  margin-top: 16px;
  color: rgba(255,255,255,.28);
  font-size: 12px; letter-spacing: .02em;
}
.slider-hint b { color: rgba(255,255,255,.45); font-weight: 600; }

@media (max-height: 650px) {
  .slider-wrap { margin-top: 32px; }
}
</style>

var _unlocked = false;

(function(){
  var slider  = document.getElementById('slider'),
      fill    = document.getElementById('slider-fill'),
      handle  = document.getElementById('handle'),
      gate    = document.getElementById('gate'),
      THRESH  = 0.90,
      dragging = false, startX = 0, cur = 0;

  function maxX() { return slider.clientWidth - handle.offsetWidth - 10; }

  function setX(x) {
    var m = maxX();
    cur = m > 0 ? Math.max(0, Math.min(m, x)) : 0;
    handle.style.transform = 'translateX(' + cur + 'px)';
    fill.style.width = (cur + handle.offsetWidth + 5) + 'px';
    return m > 0 ? cur / m : 1;
  }

  function unlock() {
    if (_unlocked) return;
    _unlocked = true;
    setX(maxX());
    slider.classList.add('done');
    gate.classList.add('revealed');
    setTimeout(function() {
      var decoded = new TextDecoder('utf-8').decode(
        Uint8Array.from(atob(ENCODED), function(c) { return c.charCodeAt(0); })
      );
      document.open();
      document.write(decoded);
      document.close();
    }, 350);
  }

  function down(e) {
    if (_unlocked) return;
    dragging = true; startX = e.clientX - cur;
    slider.classList.add('dragging');
    try { handle.setPointerCapture(e.pointerId); } catch(_) {}
  }
  function move(e) {
    if (!dragging) return;
    if (setX(e.clientX - startX) >= THRESH) { unlock(); }
  }
  function up() {
    if (!dragging) return;
    dragging = false;
    slider.classList.remove('dragging');
    if (!_unlocked) { setX(0); }
  }

  handle.addEventListener('pointerdown', down);
  handle.addEventListener('pointermove', move);
  handle.addEventListener('pointerup', up);
  handle.addEventListener('pointercancel', up);
  handle.addEventListener('lostpointercapture', up);
  window.addEventListener('resize', function() { if (!_unlocked) setX(cur); });
  setX(0);
})();
</script>
